name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Non-secret test values. CONTACT_ENCRYPTION_KEY must decode to 32 bytes.
  PUBLIC_CARD_ORIGIN: http://localhost:3200
  VIEW_COOKIE_SECRET: ci-only-non-secret-value-please-override-32
  BETTER_AUTH_SECRET: ci-only-non-secret-value-please-override-32
  CONTACT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  EMAIL_LOOKUP_KEY: ci-only-non-secret-value-please-override-32
  IP_HASH_KEY: ci-only-non-secret-value-please-override-32
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, unit & integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noka
          POSTGRES_PASSWORD: noka
          POSTGRES_DB: noka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://noka:noka@localhost:5432/noka
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # A committed absolute path from someone's laptop (a pnpm store-dir, an editor config)
      # makes every later step fail in a way that looks nothing like the cause. Fail loudly
      # and early instead: it cost five red runs to find a one-line `.npmrc`.
      - name: No machine-specific absolute paths in tracked files
        run: |
          # Prose may name a sandbox path; configuration may not.
          if git grep -n -I -E '/home/[a-z0-9_-]+/|/Users/[a-z0-9_-]+/' -- . ':!docs' ':!*.md' > /tmp/abs-paths.txt; then
            echo "Tracked files contain absolute paths from a local machine:"
            cat /tmp/abs-paths.txt
            exit 1
          fi
          echo "clean"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      # astro build also catches template and route errors the typecheck misses
      - run: pnpm build

  e2e:
    name: End-to-end & axe
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noka
          POSTGRES_PASSWORD: noka
          POSTGRES_DB: noka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://noka:noka@localhost:5432/noka
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # A committed absolute path from someone's laptop (a pnpm store-dir, an editor config)
      # makes every later step fail in a way that looks nothing like the cause. Fail loudly
      # and early instead: it cost five red runs to find a one-line `.npmrc`.
      - name: No machine-specific absolute paths in tracked files
        run: |
          # Prose may name a sandbox path; configuration may not.
          if git grep -n -I -E '/home/[a-z0-9_-]+/|/Users/[a-z0-9_-]+/' -- . ':!docs' ':!*.md' > /tmp/abs-paths.txt; then
            echo "Tracked files contain absolute paths from a local machine:"
            cat /tmp/abs-paths.txt
            exit 1
          fi
          echo "clean"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
